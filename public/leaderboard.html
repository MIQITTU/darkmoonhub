<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard · Darkmoon Hub</title>
<meta name="description" content="Top scorers in every Darkmoon Hub test.">
<meta name="theme-color" content="#05050b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="leaderboard.html">
<div id="top"></div>
<main class="wrap">
<a class="back" href="tests.html">← Tests</a>
<div style="display:grid;gap:10px"><h1 class="neon-m">Leaderboard</h1>
<p class="sub">Ranked by z-score: how far each score sits above chance. Each player's best run counts, except Remote Viewing, which ranks all sessions together.</p></div>
<div class="tabs" id="tabs" role="tablist"></div>
<section class="panel">
  <div class="row" style="justify-content:space-between"><h2 id="tname"></h2><a class="btn" id="play" href="#">Take this test</a></div>
  <p class="notice" id="local" hidden>Leaderboard server not connected. Showing your scores saved in this browser only.</p>
  <div class="scroll-x"><table class="board"><thead><tr><th>#</th><th>Name</th><th style="text-align:right">Score</th><th style="text-align:right">Z</th><th style="text-align:right">Runs</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody></table></div>
  <p class="muted" id="note" style="font-size:.92rem"></p>
</section>
</main>
<div id="foot"></div>
<script src="assets/board.js"></script>
<script src="assets/app.js"></script>
<script>
const $=id=>document.getElementById(id),me=UP.user();let cur=(location.hash||'').slice(1);if(!Board.TESTS.some(t=>t.id===cur))cur='esp';
$('tabs').innerHTML=Board.TESTS.map((t,k)=>`<button class="btn ${k%2?'mag':''}" role="tab" type="button" data-t="${t.id}">${t.name}</button>`).join('');
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{cur=b.dataset.t;try{history.replaceState(null,'','#'+cur)}catch(e){}load()});
async function load(){const t=Board.TESTS.find(x=>x.id===cur);
  document.querySelectorAll('[data-t]').forEach(b=>{b.classList.toggle('on',b.dataset.t===cur);b.setAttribute('aria-selected',b.dataset.t===cur)});
  $('tname').textContent=t.name;$('play').href=t.file;$('rows').innerHTML='<tr><td colspan="5" class="muted">Loading…</td></tr>';
  let res;try{res=await UP.leaderboard(cur)}catch(e){$('rows').innerHTML=`<tr><td colspan="5" class="err">${UP.esc(e.message)}</td></tr>`;return}
  $('local').hidden=!res.local;
  $('rows').innerHTML=res.rows.length?res.rows.map((r,i)=>`<tr class="${me&&me.uid===r.uid?'me':''}"><td class="rk mono">${i+1}</td><td>${res.local?UP.esc(r.name):`<a class="who-link" href="profile.html#${UP.esc(r.uid)}">${UP.esc(r.name)}</a>`}${me&&me.uid===r.uid?' <span class="pill c">You</span>':''}</td>
    <td class="n">${r.score} / ${r.of}</td><td class="n">${r.z.toFixed(2)}</td><td class="n">${r.runs}</td></tr>`).join(''):
    `<tr><td colspan="5" class="muted">No scores yet. The first name on this board is still open.</td></tr>`;
  $('note').textContent=t.total?`Remote Viewing totals direct hits over all sessions; chance is 1 in 4. Players need ${t.minN} sessions to appear.`:`Chance expectation is ${(t.n*t.p).toFixed(t.n*t.p%1?1:0)} out of ${t.n}. ${me?'':'Sign in to have your scores posted here.'}`}
load();
</script>
</body>
</html>
