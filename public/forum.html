<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forum · Darkmoon Hub</title>
<meta name="description" content="Post and discuss experiences with other Darkmoon Hub members.">
<meta name="theme-color" content="#05050b">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="forum.html">
<div id="top"></div>
<main class="wrap">
<div class="row" style="justify-content:space-between"><h1 class="neon-c" style="font-size:1.6rem">Forum</h1><button class="btn mag" id="newb" type="button">New thread</button></div>
<form class="panel" id="nf" hidden novalidate>
  <h2>New thread</h2>
  <div class="field"><label class="lbl" for="nt">Title</label><input type="text" id="nt" maxlength="120" placeholder="What happened?"></div>
  <div class="field"><label class="lbl" for="nb">Your experience</label><textarea id="nb" maxlength="10000" style="min-height:180px" placeholder="Describe it in as much detail as you can: when, where, what you noticed, and any results."></textarea></div>
  <p class="err" id="nerr" hidden></p><div class="row"><button class="btn" type="submit">Post thread</button><button class="btn ghost" type="button" id="nc">Cancel</button></div>
</form>
<form class="searchbar" id="sf" role="search"><input type="search" id="q" placeholder="Search threads, posts and authors" aria-label="Search the forum"><button class="btn" type="submit">Search</button></form>
<div id="list" class="list"><p class="empty">Loading…</p></div>
</main>
<div id="foot"></div>
<script src="assets/app.js"></script>
<script>
const $=id=>document.getElementById(id);
async function load(){const q=$('q').value.trim();
  if(!(await UP.connect())){$('list').innerHTML='<div class="panel"><p class="notice">The forum needs the Darkmoon Hub server, which isn\'t running here.</p></div>';return}
  try{const t=(await UP.api('GET','threads'+(q?'?q='+encodeURIComponent(q):''))).threads;
    $('list').innerHTML=t.length?t.map(x=>`<article class="item-card"><h3><a href="thread.html#${x.id}">${UP.esc(x.title)}</a></h3><p class="ex">${UP.esc(x.excerpt)}${x.excerpt.length>=220?'…':''}</p>
      <div class="meta-row">${UP.who(x.author)}<span>· ${UP.ago(x.at)}</span><span>· ${x.comments} comment${x.comments===1?'':'s'}</span>${x.lastAt>x.at?`<span>· active ${UP.ago(x.lastAt)}</span>`:''}</div></article>`).join(''):
      `<div class="panel empty">${q?'No threads match that search.':'No threads yet. Be the first to post an experience.'}</div>`}
  catch(x){$('list').innerHTML=`<p class="err">${UP.esc(x.message)}</p>`}}
$('sf').onsubmit=e=>{e.preventDefault();load()};let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(load,350)};
$('newb').onclick=UP.guard(async e=>{if(!UP.user()){UP.goSignIn();return}$('nf').hidden=false;$('nt').focus()});$('nc').onclick=()=>$('nf').hidden=true;
$('nf').onsubmit=UP.guard(async e=>{e.preventDefault();const er=$('nerr');er.hidden=true;try{const j=await UP.api('POST','threads',{title:$('nt').value,body:$('nb').value});location.href='thread.html#'+j.thread.id}catch(x){er.hidden=false;er.textContent=x.message}});
load();
</script>
</body>
</html>
