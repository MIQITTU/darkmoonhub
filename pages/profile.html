{"title":"Profile","desc":"A Darkmoon Hub member's activity and achievements."}
<div id="app"><p class="empty">Loading…</p></div>
<script>
const app=document.getElementById('app');
async function load(){
  if(!(await UP.connect())){app.innerHTML='<div class="panel"><p class="notice">Profiles need the Darkmoon Hub server, which isn\'t running here.</p></div>';return}
  const me=UP.user();let uid=location.hash.slice(1)||(me&&me.uid);
  if(!uid){await UP.gate(app,'Your profile');return}
  let p;try{p=await UP.api('GET','users/'+encodeURIComponent(uid))}catch(x){app.innerHTML=`<div class="panel"><p class="err">${UP.esc(x.message)}</p></div>`;return}
  const u=p.user,c=p.counts,own=me&&me.uid===u.uid,admin=me&&me.role==='admin',earned=p.achievements.filter(a=>a.earned).length;
  const stat=(l,v)=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`;
  app.innerHTML=`<div style="display:grid;gap:22px">
    <section class="panel"><div class="row" style="justify-content:space-between;align-items:start"><div style="display:grid;gap:6px;min-width:0">
      <h1 class="neon-c" style="font-size:clamp(1.8rem,5vw,2.6rem);text-transform:none;overflow-wrap:anywhere">${UP.esc(u.name)}</h1>
      <div class="meta-row">${u.role==='admin'?'<span class="pill c">Admin</span>':''}${u.banned?'<span class="pill miss">Banned</span>':''}<span>Member since ${new Date(u.created).toLocaleDateString()}</span><span>· ${earned}/${p.achievements.length} achievements</span></div>
      ${u.bio?`<p style="max-width:62ch">${UP.rich(u.bio)}</p>`:own?'<p class="muted">Add a short bio so others know who you are.</p>':''}</div>
      <div class="row">${me&&!own&&!u.banned?`<a class="btn mag" href="dms.html#u-${u.uid}">Message</a>`:''}${own?'<button class="btn ghost" id="edit" type="button">Edit profile</button><button class="btn ghost" id="out" type="button">Sign out</button>':''}${admin&&!own?`<a class="btn ghost" href="admin.html#${u.uid}">Moderate</a>`:''}</div></div>
      <form id="ef" hidden style="display:grid;gap:12px"><div class="field"><label class="lbl" for="en">Display name</label><input type="text" id="en" maxlength="24" value="${UP.esc(u.name)}"></div>
        <div class="field"><label class="lbl" for="eb">Bio</label><textarea id="eb" maxlength="500">${UP.esc(u.bio)}</textarea></div><p class="err" id="eerr" hidden></p><div class="row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="ec">Cancel</button></div></form>
      <div class="stats">${stat('Chat messages',c.chat)}${stat('Threads',c.threads)}${stat('Comments',c.comments)}${stat('Map pins',c.pins)}${stat('Listings',c.listings)}</div></section>
    <section class="panel"><h2>Achievements</h2><div class="ach">${p.achievements.map(a=>`<div class="${a.earned?'on':''}"><b>${a.earned?'◆ ':'◇ '}${UP.esc(a.name)}</b><small>${UP.esc(a.desc)}</small></div>`).join('')}</div></section>
    <div class="grid2"><section class="panel"><h2>Forum threads</h2>${p.threads.length?`<div class="list">${p.threads.map(t=>`<div style="display:grid;gap:2px"><a class="who-link" href="thread.html#${t.id}">${UP.esc(t.title)}</a><span class="ts">${UP.ago(t.at)} · ${t.comments} comment${t.comments===1?'':'s'}</span></div>`).join('')}</div>`:'<p class="muted">No threads yet.</p>'}</section>
      <section class="panel"><h2>Market & map</h2>${p.listings.map(l=>`<div class="meta-row"><a class="who-link" href="market.html#${l.id}">${UP.esc(l.title)}</a><span class="price" style="font-size:.95rem">${UP.esc(l.price)}</span>${l.sold?'<span class="pill">Sold</span>':''}</div>`).join('')||'<p class="muted">No listings.</p>'}
        ${p.pins.map(x=>`<div><a class="who-link" href="map.html#${x.id}">◉ ${UP.esc(x.title)}</a></div>`).join('')||'<p class="muted">No map pins.</p>'}</section></div></div>`;
  if(own){const ef=document.getElementById('ef');document.getElementById('edit').onclick=()=>{ef.hidden=!ef.hidden};document.getElementById('ec').onclick=()=>ef.hidden=true;
    document.getElementById('out').onclick=UP.guard(async e=>{await UP.signOut();location.href='index.html'});
    ef.onsubmit=UP.guard(async e=>{e.preventDefault();const er=document.getElementById('eerr');er.hidden=true;try{await UP.api('PATCH','me',{name:document.getElementById('en').value,bio:document.getElementById('eb').value});await UP.refreshMe();location.reload()}catch(x){er.hidden=false;er.textContent=x.message}})}
}
window.addEventListener('hashchange',load);load();
</script>
