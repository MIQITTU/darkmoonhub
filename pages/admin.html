{"title":"Admin","desc":"Darkmoon Hub administration."}
<h1 class="neon-c" style="font-size:1.6rem;color:var(--gold);text-shadow:0 0 14px rgba(255,210,59,.45)">Admin panel</h1>
<div id="app"></div>
<script>
const app=document.getElementById('app');let me;
(async()=>{me=await UP.gate(app,'The admin panel');if(!me)return;me=await UP.refreshMe();
  if(!me||me.role!=='admin'){app.innerHTML='<div class="panel"><p class="notice">This page is for administrators.</p></div>';return}
  app.innerHTML=`<div style="display:grid;gap:22px">
    <section class="panel"><h2>Chat rooms</h2><div id="rooms" class="list"></div>
      <form id="nr" class="grid2" style="align-items:end"><div class="field"><label class="lbl" for="rt">New room name</label><input type="text" id="rt" maxlength="40"></div>
      <div class="field"><label class="lbl" for="rd">Description</label><input type="text" id="rd" maxlength="200"></div><button class="btn" type="submit" style="justify-self:start">Create room</button></form></section>
    <section class="panel"><h2>Members</h2><form class="searchbar" id="uf"><input type="search" id="uq" placeholder="Search by name or email" aria-label="Search members"><button class="btn" type="submit">Search</button></form>
      <div class="tablewrap"><table class="board"><thead><tr><th>Member</th><th>Status</th><th style="text-align:right">Threads</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div>
      <p class="muted" style="font-size:.9rem">Muted members can read but can't post anywhere. Banned members are signed out and blocked. Content (messages, threads, comments, listings, pins) can be deleted directly from where it appears.</p></section></div>`;
  document.getElementById('nr').onsubmit=UP.guard(async e=>{e.preventDefault();try{await UP.api('POST','rooms',{title:document.getElementById('rt').value,desc:document.getElementById('rd').value});document.getElementById('rt').value='';document.getElementById('rd').value='';rooms();UP.toast('Room created')}catch(x){UP.toast(x.message)}});
  document.getElementById('uf').onsubmit=e=>{e.preventDefault();users()};
  const h=location.hash.slice(1);rooms();users(h);
})();
async function rooms(){const r=(await UP.api('GET','rooms')).rooms,box=document.getElementById('rooms');
  box.innerHTML=r.map((x,i)=>`<form class="item-card" data-id="${x.id}" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;align-items:end;gap:10px">
    <div class="field"><label class="lbl">Name</label><input type="text" name="title" maxlength="40" value="${UP.esc(x.title)}"></div><div class="field"><label class="lbl">Description</label><input type="text" name="desc" maxlength="200" value="${UP.esc(x.desc)}"></div>
    <div class="row" style="gap:6px"><button class="btn sm" type="submit">Save</button><button class="btn ghost sm" type="button" data-up ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn ghost sm" type="button" data-del>Delete</button></div>
    <span class="ts" style="grid-column:1/-1">${x.count} messages</span></form>`).join('');
  box.querySelectorAll('form').forEach((f,i)=>{const id=f.dataset.id;
    f.onsubmit=UP.guard(async e=>{e.preventDefault();try{await UP.api('PATCH','rooms/'+id,{title:f.title.value,desc:f.desc.value});UP.toast('Room saved')}catch(x){UP.toast(x.message)}});
    f.querySelector('[data-up]').onclick=UP.guard(async e=>{const a=r[i],b=r[i-1];await UP.api('PATCH','rooms/'+a.id,{order:i-1});await UP.api('PATCH','rooms/'+b.id,{order:i});rooms()});
    UP.confirmBtn(f.querySelector('[data-del]'),'Delete room + messages',async()=>{await UP.api('DELETE','rooms/'+id);rooms()})});
  r.forEach((x,i)=>{if(x.order!==i)UP.api('PATCH','rooms/'+x.id,{order:i}).catch(()=>{})})}
async function users(focus){const q=document.getElementById('uq').value.trim();let list;try{list=(await UP.api('GET','admin/users'+(q?'?q='+encodeURIComponent(q):''))).users}catch(x){UP.toast(x.message);return}
  const tb=document.getElementById('users');
  tb.innerHTML=list.map(u=>{const muted=u.mutedUntil>Date.now();return`<tr id="u-${u.uid}" ${focus===u.uid?'style="outline:1px solid var(--cyan)"':''}><td style="min-width:180px">${UP.who(u)}<br><span class="ts">${UP.esc(u.email)}</span></td>
    <td>${u.banned?'<span class="pill miss">Banned</span>':muted?`<span class="pill" style="color:var(--gold);border-color:var(--gold)">Muted until ${new Date(u.mutedUntil).toLocaleString()}</span>`:'<span class="pill hit">Active</span>'}</td><td class="n">${u.posts}</td>
    <td><div class="row" style="gap:6px;flex-wrap:wrap;min-width:260px">${u.uid===me.uid?'<span class="muted">You</span>':`
      ${muted?'<button class="btn ghost sm" data-a="unmute" type="button">Unmute</button>':`<select data-min aria-label="Mute length" style="width:auto;padding:6px"><option value="60">1 hour</option><option value="1440">1 day</option><option value="10080">1 week</option><option value="43200">30 days</option></select><button class="btn ghost sm" data-a="mute" type="button">Mute</button>`}
      ${u.banned?'<button class="btn ghost sm" data-a="unban" type="button">Unban</button>':'<button class="btn ghost sm" data-a="ban" type="button">Ban</button>'}
      ${u.role==='admin'?'<button class="btn ghost sm" data-a="demote" type="button">Remove admin</button>':'<button class="btn ghost sm" data-a="promote" type="button">Make admin</button>'}`}</div></td></tr>`}).join('')||'<tr><td colspan="4" class="muted">No members match.</td></tr>';
  tb.querySelectorAll('tr[id]').forEach(tr=>{const uid=tr.id.slice(2);tr.querySelectorAll('[data-a]').forEach(b=>{const a=b.dataset.a,run=async()=>{await UP.api('POST','admin/users/'+uid,{action:a,minutes:tr.querySelector('[data-min]')?.value});UP.toast('Done');users(uid)};
    if(['ban','promote','demote'].includes(a))UP.confirmBtn(b,'Confirm',run);else b.onclick=()=>run().catch(x=>UP.toast(x.message))})});
  if(focus)document.getElementById('u-'+focus)?.scrollIntoView({block:'center'})}
</script>
